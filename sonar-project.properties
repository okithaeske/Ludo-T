# ─────────────────────────────────────────────────────────────────────────────
# sonar-project.properties  —  SonarQube / SonarCloud project configuration
#
# Usage:
#   1. Run .\coverage.ps1 first (generates coverage-report\jacoco.xml)
#   2. Run .\run-sonar.ps1 (or sonar-scanner directly)
# ─────────────────────────────────────────────────────────────────────────────

# ── Identity ─────────────────────────────────────────────────────────────────
sonar.projectKey=ludo-t
sonar.projectName=Ludo - T
sonar.projectVersion=1.0

# ── Source layout ────────────────────────────────────────────────────────────
sonar.sources=src
sonar.tests=src/test/test
sonar.exclusions=src/test/**,src/**/package-info.java

# ── Java binaries (JaCoCo-compiled at --release 23) ──────────────────────────
sonar.java.binaries=out/coverage
sonar.java.test.binaries=out/coverage-test

# ── Coverage (generated by .\coverage.ps1) ───────────────────────────────────
sonar.coverage.jacoco.xmlReportPaths=coverage-report/jacoco.xml

# ── Language ─────────────────────────────────────────────────────────────────
sonar.language=java
sonar.java.source=23
sonar.sourceEncoding=UTF-8

# ── Server connection (fill in before running sonar-scanner) ─────────────────
# For local SonarQube (Community Edition):
sonar.host.url=http://localhost:9000
sonar.token=sqa_7fe3fa107f212fb4ee9493f416b82ec2b05c889c
